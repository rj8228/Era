<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Era</title>
<meta name="description" content="See where your week really goes, move hours on purpose, and plan your eras: daily, weekly and quarterly retros.">
<meta name="theme-color" content="#1B1F33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Era">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F4F8; --surface:#FFFFFF; --sunk:#E6E9F0; --ink:#1B1F33; --ink2:#3D4560; --muted:#5A6075; --line:#E3E6EE; --line2:#C9CEDC;
  --accent:#2463C9; --accent-soft:#EAF0FB; --good:#1F5E38; --good-soft:#E2F1E7; --warn:#A3321D; --warn-soft:#FBE6E1; --gold:#7A5200; --gold-soft:#FBF1DA;
  --btn:#1B1F33; --btn-ink:#FFFFFF;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif; --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121522; --surface:#1B1F30; --sunk:#262B40; --ink:#E9EBF3; --ink2:#C3C8D8; --muted:#9AA1B8; --line:#2C3247; --line2:#3B4260;
    --accent:#7FA6EE; --accent-soft:#1F2A44; --good:#7FD3A0; --good-soft:#18301F; --warn:#F2907E; --warn-soft:#3A1F1A; --gold:#F0C76A; --gold-soft:#3A2F14;
    --btn:#E9EBF3; --btn-ink:#121522; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121522; --surface:#1B1F30; --sunk:#262B40; --ink:#E9EBF3; --ink2:#C3C8D8; --muted:#9AA1B8; --line:#2C3247; --line2:#3B4260;
  --accent:#7FA6EE; --accent-soft:#1F2A44; --good:#7FD3A0; --good-soft:#18301F; --warn:#F2907E; --warn-soft:#3A1F1A; --gold:#F0C76A; --gold-soft:#3A2F14;
  --btn:#E9EBF3; --btn-ink:#121522; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;min-height:100dvh}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:540px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom))}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);max-width:540px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) 16px 6px;display:flex;align-items:center;gap:8px}
.brand{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:-.4px}
.brand small{font-family:var(--body);font-weight:500;font-size:14px;color:var(--muted);margin-left:6px;letter-spacing:0}
header.top .sp{flex:1}
.icon-btn{width:44px;height:44px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;color:var(--ink)}
.icon-btn:hover{background:var(--sunk)}
.icon-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
h1{font-family:var(--display);font-weight:800;font-size:28px;line-height:1.1;letter-spacing:-.5px;margin:6px 0 4px}
h2{font-family:var(--display);font-weight:800;font-size:20px;line-height:1.2;margin:22px 0 8px;letter-spacing:-.2px}
h3{font-size:16px;margin:0;font-weight:700}
p{margin:0 0 8px}
.muted{color:var(--muted)} .small{font-size:14px} .tiny{font-size:13px}
.card{background:var(--surface);border-radius:16px;padding:14px 16px;margin:10px 0}
.card.dark{background:var(--btn);color:var(--btn-ink)}
.card.dark .muted{color:inherit;opacity:.75}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);min-height:48px}
.li:last-child{border-bottom:0}
.btn{min-height:48px;border-radius:999px;border:1.5px solid var(--line2);background:var(--surface);padding:0 18px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;color:var(--ink);text-decoration:none}
.btn.primary{background:var(--btn);border-color:var(--btn);color:var(--btn-ink)}
.btn.block{width:100%}
.btn.sm{min-height:38px;padding:0 14px;font-size:14px}
.btn.warn{color:var(--warn);border-color:var(--warn)}
.btn.dash{border-style:dashed;background:transparent}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:38px;padding:0 12px;border-radius:999px;border:1.5px solid var(--line2);background:var(--surface);font-size:14px;font-weight:500;color:var(--ink)}
.chip[aria-pressed="true"]{border:2px solid var(--ink);background:var(--sunk);font-weight:700}
.seg{display:flex;background:var(--sunk);border-radius:999px;padding:3px;gap:2px}
.seg button{flex:1;min-height:40px;border:0;border-radius:999px;background:transparent;font-size:15px;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.step{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line2);background:var(--surface);font-size:18px;font-weight:600;color:var(--ink);flex:none}
.val{min-width:52px;text-align:center;font-weight:700}
label.f{display:block;font-size:14px;font-weight:600;color:var(--ink2);margin:12px 0 4px}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{width:100%;min-height:46px;border:1.5px solid var(--line2);border-radius:10px;background:var(--surface);padding:0 12px}
textarea{padding:10px 12px;min-height:80px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{display:flex;flex-direction:column}
.stat b{font-family:var(--display);font-weight:800;font-size:26px;line-height:1.1}
.stat span{font-size:13px;opacity:.8}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.bar{height:10px;border-radius:5px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:10px;border-radius:5px}
.cmp{display:grid;grid-template-columns:110px 1fr 74px;gap:8px;align-items:center;font-size:14px;padding:4px 0}
.cmp .t{text-align:right;font-weight:700}
.dot{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:6px}
.stripe{background:repeating-linear-gradient(45deg,#D2452C 0 3px,#F6D3CC 3px 6px)}
.tag{display:inline-block;font-size:12.5px;font-weight:700;border-radius:6px;padding:2px 8px;background:var(--sunk);color:var(--ink2)}
.tag.good{background:var(--good-soft);color:var(--good)} .tag.warn{background:var(--warn-soft);color:var(--warn)} .tag.blue{background:var(--accent-soft);color:var(--accent)}
.pent{display:block;margin:0 auto;max-width:100%}
.legend{display:flex;gap:16px;justify-content:center;font-size:13px;color:var(--ink2);flex-wrap:wrap}
.minis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.minis div{text-align:center;font-size:13px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{max-width:540px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
nav.tabs button{border:0;background:none;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;color:var(--muted)}
nav.tabs svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--ink);font-weight:700}
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(10,12,20,.5)}
.sheet .in{background:var(--bg);width:100%;max-width:540px;max-height:92dvh;overflow:auto;border-radius:20px 20px 0 0;padding:8px 16px calc(24px + env(safe-area-inset-bottom));animation:up .2s ease-out}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line2);margin:4px auto 6px}
.sheet .hd{display:flex;align-items:center;gap:8px;position:sticky;top:-8px;background:var(--bg);padding:6px 0;z-index:1}
.sheet .hd h2{margin:0;flex:1;outline:none}
@keyframes up{from{transform:translateY(60px)}to{transform:none}}
@media (prefers-reduced-motion: reduce){.sheet .in{animation:none}}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--btn);color:var(--btn-ink);padding:10px 18px;border-radius:999px;z-index:40;font-size:15px;max-width:90vw}
.onb{padding-top:calc(20px + env(safe-area-inset-top))}
.progress{flex:1;height:6px;border-radius:3px;background:var(--line2);overflow:hidden}
.progress i{display:block;height:6px;background:var(--ink)}
.foot{font-size:13px;color:var(--muted);margin:22px 0}
.foot a{color:inherit}
.check{display:flex;align-items:center;gap:10px;min-height:44px}
.check input{width:22px;height:22px;accent-color:var(--ink);flex:none;margin:0}
</style>
</head>
<body>
<header class="top" id="top">
  <div class="brand" id="brand">Era</div>
  <div class="sp"></div>
  <button class="icon-btn" id="btnSettings" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
</header>
<main class="wrap" id="view"></main>
<nav class="tabs" id="tabs" aria-label="Sections"><div class="in">
  <button data-tab="today"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Today</button>
  <button data-tab="week"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Week</button>
  <button data-tab="era"><svg viewBox="0 0 24 24"><path d="M12 3l8.6 6.2-3.3 10.1H6.7L3.4 9.2z"/></svg>Era</button>
</div></nav>
<div id="sheets"></div>
<script src="app.js"></script>
</body>
</html>
