<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Era</title>
<meta name="description" content="See where your week really goes, then spend your free hours on purpose: a 24-hour dial, more of and less of, daily, weekly and era retros.">
<meta name="theme-color" content="#1B1F33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Era">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F4F8; --surface:#FFFFFF; --sunk:#E6E9F0; --ink:#1B1F33; --ink2:#3D4560; --muted:#5A6075; --line:#E3E6EE; --line2:#C9CEDC;
  --accent:#2463C9; --accent-soft:#EAF0FB; --good:#1F5E38; --good-soft:#E2F1E7; --warn:#A3321D; --warn-soft:#FBE6E1; --amber:#9A5B0C; --amber-soft:#FFF4E2;
  --warnbar:#D2452C; --goodbar:#2E9A60; --btn:#1B1F33; --btn-ink:#FFFFFF;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif; --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#121522; --surface:#1B1F30; --sunk:#262B40; --ink:#E9EBF3; --ink2:#C3C8D8; --muted:#9AA1B8; --line:#2C3247; --line2:#3B4260;
  --accent:#7FA6EE; --accent-soft:#1F2A44; --good:#7FD3A0; --good-soft:#18301F; --warn:#F2907E; --warn-soft:#3A1F1A; --amber:#F0C76A; --amber-soft:#3A2F14;
  --warnbar:#E8634B; --goodbar:#4CB57E; --btn:#E9EBF3; --btn-ink:#121522; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#121522; --surface:#1B1F30; --sunk:#262B40; --ink:#E9EBF3; --ink2:#C3C8D8; --muted:#9AA1B8; --line:#2C3247; --line2:#3B4260;
  --accent:#7FA6EE; --accent-soft:#1F2A44; --good:#7FD3A0; --good-soft:#18301F; --warn:#F2907E; --warn-soft:#3A1F1A; --amber:#F0C76A; --amber-soft:#3A2F14;
  --warnbar:#E8634B; --goodbar:#4CB57E; --btn:#E9EBF3; --btn-ink:#121522; color-scheme:dark; }
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;min-height:100dvh}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:540px;margin:0 auto;padding:calc(8px + env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom))}
body.flow .wrap{padding-bottom:calc(32px + env(safe-area-inset-bottom))}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);max-width:540px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) 16px 2px;display:flex;align-items:center;gap:8px}
header.top + .wrap{padding-top:0}
.brand{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.4px}
.brand small{font-family:var(--body);font-weight:500;font-size:14px;color:var(--muted);margin-left:8px;letter-spacing:0}
.brand.big{font-size:30px}
h1{font-family:var(--display);font-weight:800;font-size:28px;line-height:1.1;letter-spacing:-.5px;margin:6px 0 4px}
h1.hero{font-size:30px}
h2{font-family:var(--display);font-weight:800;font-size:20px;line-height:1.2;margin:22px 0 8px;letter-spacing:-.2px}
h3{font-size:16px;margin:0;font-weight:700}
p{margin:0 0 8px}
.muted{color:var(--muted)} .small{font-size:14px} .tiny{font-size:13px} .center{text-align:center} .lh{line-height:1.6}
.warnc{color:var(--warn)} .goodc{color:var(--good)} .amber{color:var(--amber)}
.card{background:var(--surface);border-radius:16px;padding:14px 16px;margin:10px 0;display:block;width:100%;text-align:left;border:0;color:var(--ink)}
.card.list{padding:4px 16px}
.card.dark{background:var(--btn);color:var(--btn-ink)}
.card.dark .muted{color:inherit;opacity:.75}
.card.good{background:var(--good-soft);color:var(--good)}
.card.tip{background:var(--accent-soft)}
.card.banner{background:var(--amber-soft);color:var(--amber);font-size:14px}
.card.warnsoft,.card.mism{background:var(--amber-soft);border:1.5px solid #F2B04A}
.card.mism{font-size:14px}
.card.inner{margin:0 0 10px}
.rowcard{display:flex!important;align-items:center;gap:10px}
.warnline{border:1.5px solid #E0742A!important}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);min-height:48px;width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;color:var(--ink)}
.li:last-child{border-bottom:0}
.rowlink{display:flex;align-items:center;gap:10px;width:100%;min-height:56px;padding:10px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;color:var(--ink)}
.rowlink:last-child{border-bottom:0}
.chev{font-size:22px;color:var(--muted);line-height:1}
.subhd{margin:2px 0 0}
.backbtn{border:0;background:none;color:var(--muted);font-size:15px;padding:8px 0;min-height:40px}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:600;font-size:14px;min-height:36px}
.titlebtn{border:0;background:none;padding:0;text-align:left;color:var(--ink)}
.btn{min-height:48px;border-radius:999px;border:1.5px solid var(--line2);background:var(--surface);padding:0 18px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;color:var(--ink);text-decoration:none;text-align:center}
.btn.primary{background:var(--btn);border-color:var(--btn);color:var(--btn-ink)}
.btn.block{width:100%}
.btn.sm{min-height:38px;padding:0 14px;font-size:14px}
.btn.warn{color:var(--warn);border-color:var(--warn)}
.btn.warnb{color:var(--warn);border-color:var(--warn);background:var(--warn-soft)}
.btn.goodb{color:var(--good);border-color:var(--good);background:var(--good-soft)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.btns.col{flex-direction:column}
.btns.sticky{position:sticky;bottom:calc(8px + env(safe-area-inset-bottom));background:var(--bg);padding:8px 0;margin-bottom:0}
.icon-btn{width:44px;height:44px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;color:var(--ink);font-size:18px;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:38px;padding:0 12px;border-radius:999px;border:1.5px solid var(--line2);background:var(--surface);font-size:14px;font-weight:500;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.chip[style*="--cc"]::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--cc);flex:none}
.chip[aria-pressed="true"]{border:2px solid var(--ink);background:var(--sunk);font-weight:700}
.seg{display:flex;background:var(--sunk);border-radius:999px;padding:3px;gap:2px}
.seg.wrap{flex-wrap:wrap;border-radius:16px}
.seg button{flex:1;min-height:40px;border:0;border-radius:999px;background:transparent;font-size:15px;color:var(--ink2);padding:0 10px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.opt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin:8px 0;color:var(--ink)}
.opt[aria-pressed="true"]{border:2px solid var(--ink)}
.toggle{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:0;border-radius:16px;padding:12px 16px;margin:10px 0;color:var(--ink)}
.tg{width:42px;height:24px;border-radius:12px;background:var(--line2);position:relative;flex:none;transition:background .15s}
.tg::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
.toggle[aria-pressed="true"] .tg{background:var(--good)}
.toggle[aria-pressed="true"] .tg::after{left:21px}
.stp{display:inline-flex;align-items:center;gap:6px;flex:none}
.step{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line2);background:var(--surface);font-size:18px;font-weight:600;color:var(--ink);flex:none}
.val{min-width:54px;text-align:center;font-weight:700}
label.f{display:block;font-size:14px;font-weight:600;color:var(--ink2);margin:14px 0 4px}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{width:100%;min-height:46px;border:1.5px solid var(--line2);border-radius:10px;background:var(--surface);padding:0 12px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{display:flex;flex-direction:column}
.stat b{font-family:var(--display);font-weight:800;font-size:26px;line-height:1.1}
.stat span{font-size:12.5px;opacity:.8}
.bignum{font-family:var(--display);font-weight:800;font-size:28px;line-height:1.15}
.big{font-size:18px}
.bar{height:10px;border-radius:5px;background:var(--sunk);overflow:hidden;position:relative}
.bar i{display:block;height:10px;border-radius:5px}
.cmp{display:grid;grid-template-columns:108px 1fr 70px;gap:8px;align-items:center;font-size:14px;padding:4px 0}
.cmp .t{text-align:right;font-weight:700}
.sw{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:6px;padding:2px 8px;background:var(--sunk);color:var(--ink2)}
.tag.good{background:var(--good-soft);color:var(--good)} .tag.blue{background:var(--accent-soft);color:var(--accent)}
.legend{display:flex;gap:14px;justify-content:center;font-size:12.5px;color:var(--ink2);flex-wrap:wrap;margin-top:4px}
/* Dial */
.dialwrap{display:flex;justify-content:center}
svg.dial{display:block;max-width:100%;height:auto}
svg.dial.editing{touch-action:none;user-select:none;-webkit-user-select:none}
.dtick{font-size:11px;fill:var(--muted);font-family:var(--body)}
.dcenter{font:800 30px var(--display);fill:var(--ink)}
.dsub{font-size:13px;fill:var(--muted);font-family:var(--body)}
.edge{fill:#fff;stroke:#1B1F33;stroke-width:3;cursor:grab}
.edge.on{fill:var(--accent);stroke:#fff}
.arc{cursor:pointer}
.dialcard{padding:10px}
.miniday{display:flex;align-items:center;gap:12px}
.miniday svg{flex:none}
.vbar{width:8px;align-self:stretch;border-radius:4px;flex:none;min-height:34px}
.pdot{width:10px;height:10px;border-radius:50%;background:#E0742A;flex:none}
.blkbtn{border:0;background:none;text-align:left;padding:0;color:var(--ink)}
/* Shape */
svg.shape{display:block;margin:0 auto;max-width:100%;height:auto}
.slab{font:700 12.5px var(--body);fill:var(--ink)}
.sval{font-size:11.5px;fill:var(--muted);font-family:var(--body)}
/* Less of */
.card.less{border:1.5px solid #F2B8AC;background:#FFF6F4}
.card.less.watch{border-style:dashed;background:var(--surface)}
.card.less.over{border-color:var(--warnbar)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .card.less{background:#2A1C1A;border-color:#6B3A30} }
.lhd{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:4px}
.lhd b{color:var(--warn)}
.lrow{display:grid;grid-template-columns:minmax(80px,auto) 1fr auto;gap:8px;align-items:center;font-size:14px;padding:4px 0}
.lrow.over b{color:var(--warn)}
.lbar{overflow:visible}
.lbar i{background:var(--warnbar)}
.lbar u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.lbar.big{height:12px}
.card.redtop{border:2px solid var(--warnbar);background:#FDE9E4;color:#7A2414}
.card.redtop .bignum{color:var(--warn)}
.card.redtop.slim{display:flex;flex-direction:column;gap:2px;padding:10px 14px}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .card.redtop{background:#3A1F1A;color:#F6C4B8} }
/* Swipe */
.swipe{position:relative;height:300px;margin:14px 0 6px}
.scard{position:absolute;left:10%;right:10%;top:6px;height:270px;border-radius:20px;background:var(--surface);border:1.5px solid var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:16px;touch-action:pan-y;user-select:none;transition:transform .18s ease-out;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.scard.back{transform:rotate(-4deg);border:1px solid var(--line);box-shadow:none}
.sbar{width:60%;height:12px;border-radius:6px}
.stime{font:800 30px var(--display)}
.sq{font-size:18px;font-weight:600}
.stamp{position:absolute;top:18px;font:800 15px var(--body);border:2.5px solid;border-radius:8px;padding:2px 8px;opacity:0}
.stamp.yes{right:18px;color:var(--good);transform:rotate(8deg)}
.stamp.no{left:18px;color:var(--warn);transform:rotate(-8deg)}
.swbtns{display:flex;align-items:center;justify-content:space-between;gap:8px}
.actgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:8px 0}
.actb{border:1.5px solid var(--line2);background:var(--surface);border-radius:12px;padding:8px 4px;font-size:12.5px;font-weight:600;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:4px;min-height:58px}
.actb i{width:18px;height:18px;border-radius:5px;display:block}
.actb[aria-pressed="true"]{border:2.5px solid var(--ink)}
details summary{cursor:pointer;color:var(--accent);margin:6px 0}
/* Week */
.weeknav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.weeknav b{font-size:15px;text-align:center}
.frameline{margin:4px 2px 10px;color:var(--ink2)}
.ladder{display:flex;align-items:flex-end;gap:6px;margin:10px 0 6px;min-height:76px}
.lstep{flex:1;text-align:center;font-size:11.5px;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;gap:3px}
.lstep i{display:block;border-radius:4px 4px 0 0;background:#F2B8AC}
.lstep.now i{background:var(--warnbar)}
.lstep.done i{background:var(--goodbar)}
.lstep.cur i{outline:2px solid var(--ink);outline-offset:1px}
.stbars{display:flex;align-items:flex-end;gap:8px;height:130px;position:relative;padding-bottom:16px}
.stbars div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;text-align:center;font-size:11px}
.stbars i{display:block;border-radius:4px 4px 0 0;min-height:2px}
.stbars span{position:absolute;bottom:0;width:calc((100% - 48px)/7)}
.stbars u{position:absolute;left:0;right:0;border-top:2px dashed var(--ink)}
.stbars div{position:relative}
.stbars div span{position:absolute;bottom:-16px;left:0;right:0;width:auto}
.receipt{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13.5px;line-height:1.8;border:1.5px dashed var(--line2)}
.rl{display:flex;justify-content:space-between;white-space:pre}
.rl.red{color:var(--warn)} .rl.b{font-weight:700} .rl.amber{color:var(--amber)}
.rsep{border-top:1.5px dashed var(--line2);margin:4px 0}
.goods{margin:6px 0 0;padding-left:18px}
/* Jars and weekends */
.jars{display:grid;gap:6px;align-items:end}
.jar{border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:stretch;text-align:center;color:var(--ink);min-width:0}
.jbox{height:128px;border:1.5px solid var(--line2);border-top:0;border-radius:0 0 12px 12px;display:flex;flex-wrap:wrap-reverse;align-content:flex-start;gap:3px;padding:4px;background:var(--surface);position:relative;overflow:hidden}
.jbox i{width:9px;height:9px;border-radius:50%;display:block}
.jbox u{position:absolute;left:0;right:0;border-top:2px dashed var(--muted)}
.jar.sel .jbox{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.jar.locked .jbox{opacity:.55}
.jn{font-size:10px;font-weight:700;margin-top:4px;line-height:1.15;hyphens:auto;-webkit-hyphens:auto;min-height:2.3em;letter-spacing:-.2px}
.jv{font-size:11px;color:var(--muted)}
.dots{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px;margin:6px 0}
.wdot{position:relative;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line2);background:transparent;padding:0;margin:auto;display:block;overflow:hidden}
.wdot::after{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:1.5px solid var(--line2)}
.wdot .wh{position:absolute;width:50%;height:50%}
.wdot .wh.l{left:0}.wdot .wh.r{right:0}.wdot .wh.t{top:0}.wdot .wh.b{bottom:0}
.wdot .wh.on{background:var(--qc);opacity:.45}.wdot .wh.done{opacity:1}
/* Paint */
.paint{display:grid;grid-template-columns:30px repeat(7,minmax(0,1fr));gap:2px;touch-action:none;user-select:none;-webkit-user-select:none;margin:10px 0}
.pc{height:12px;border-radius:2px}
.pc.ph{height:18px;font-size:11px;font-weight:700;text-align:center;color:var(--muted)}
.pc.ph.wdh{color:var(--ink)}
.pc.pt{font-size:10px;color:var(--muted);text-align:right;padding-right:3px;line-height:12px}
.pc.cell{cursor:crosshair}
.brushes .chip{min-height:34px;font-size:13px}
.chip.taken{opacity:.55;text-decoration:line-through}
.seg button.busy{opacity:.45;text-decoration:line-through}
.dates{display:flex;gap:10px;margin-top:10px}.dates label{flex:1;min-width:0}.dates input{width:100%}
.card.trip{border-left:4px solid #D9A22B}.tripicon{font-size:26px;line-height:1}
.dayrow.away{opacity:.85}.dayrow .tripicon{width:42px;text-align:center;font-size:22px}
/* Lists of shapes */
.minis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.card.mini{text-align:center;font-size:13px}
/* Tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{max-width:540px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{border:0;background:none;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12.5px;color:var(--muted)}
nav.tabs svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--ink);font-weight:700}
/* Sheets and toast */
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(10,12,20,.5)}
.sheet .in{background:var(--bg);width:100%;max-width:540px;max-height:92dvh;overflow:auto;border-radius:20px 20px 0 0;padding:8px 16px calc(24px + env(safe-area-inset-bottom));animation:up .2s ease-out}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line2);margin:4px auto 6px}
.sheet .hd{display:flex;align-items:center;gap:8px;position:sticky;top:-8px;background:var(--bg);padding:6px 0;z-index:1}
.sheet .hd h2{margin:0;flex:1;outline:none;font-size:19px}
@keyframes up{from{transform:translateY(60px)}to{transform:none}}
@media (prefers-reduced-motion: reduce){.sheet .in,.scard{animation:none;transition:none}}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--btn);color:var(--btn-ink);padding:10px 18px;border-radius:999px;z-index:40;font-size:15px;max-width:90vw;text-align:center}
.onb{padding-top:8px}
.stepn{margin-top:8px}
.foot{font-size:13px;color:var(--muted);margin:22px 0}
/* Choose */
.ink{color:var(--ink)}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.trio div{display:flex;flex-direction:column;align-items:center;gap:2px}
.buds{padding:10px 14px}
.bud{display:grid;grid-template-columns:72px 1fr auto;gap:8px;align-items:center;font-size:13px;margin:4px 0}
.bud b:last-child{text-align:right;white-space:nowrap}
.bar.slim{height:6px;margin:5px 0 3px}.bar.slim i{height:6px}
.ccs{display:inline-flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.cc{font-size:11.5px;background:var(--sunk);border-radius:6px;padding:1px 6px;color:var(--ink2);white-space:nowrap}
.cc.good{background:var(--good-soft);color:var(--good)}.cc.bad{background:var(--warn-soft);color:var(--warn)}
.score{font-family:var(--display);font-size:18px;min-width:30px;text-align:right}
.rankn{width:20px;color:var(--muted);font-weight:700;flex:none}
.scorebar{width:64px;flex:none;text-align:right}
.dots5{display:inline-flex;gap:6px;flex:none}
.dotb{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line2);background:var(--surface);padding:0}
.dotb.on{background:var(--ink);border-color:var(--ink)}
.edots{display:flex;justify-content:space-between;align-items:center;padding:6px 4px}
.edot{width:40px;height:40px;border-radius:50%;border:0;color:#fff;font:700 13px var(--body);display:grid;place-items:center}
.edot.e0{background:#D2452C}.edot.e1{background:#F0997B}.edot.e2{background:#B4B9C8}.edot.e3{background:#97C459}.edot.e4{background:#2E9A60}
.edot.on{outline:3px solid var(--ink);outline-offset:3px;transform:scale(1.08)}
.elabels{display:flex;justify-content:space-between;font-size:11.5px;padding:0 2px}
.moneyin{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line2);border-radius:10px;background:var(--surface);padding:0 10px}
.moneyin input{border:0!important;min-height:44px!important;padding:0!important;background:transparent!important}
.moneyin.sm{width:140px;flex:none}
.titlein{font:800 24px var(--display)!important;border:0!important;border-bottom:1.5px dashed var(--line2)!important;border-radius:0!important;padding:0!important;background:transparent!important;margin:4px 0 6px}
.seg.small button{font-size:13px;min-height:36px;padding:0 6px}
.tgl{border:0;background:none;padding:6px 0 6px 6px}
.tgl[aria-pressed="true"] .tg{background:var(--good)}.tgl[aria-pressed="true"] .tg::after{left:21px}
.quad{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.quad .card{margin:0;padding:10px 12px;border-radius:0 0 12px 12px}
.qi{display:block;border:0;background:none;padding:4px 0;text-align:left;font-size:13.5px;color:var(--ink);width:100%}
.matrix{display:block;width:100%;height:auto}
.ql{font:700 11px var(--body);fill:var(--muted)}.ql.good{fill:var(--good)}.ql.blue{fill:var(--accent)}.ql.bad{fill:var(--warn)}
.qa{font-size:10.5px;fill:var(--muted);font-family:var(--body)}.qb{font-size:10px;fill:var(--ink);font-family:var(--body)}
.bub{cursor:pointer}
.realrow{display:grid;grid-template-columns:96px 28px 1fr 40px;gap:8px;align-items:center;font-size:14px;padding:4px 0}
.realrow b:last-child{text-align:right}
.fitrow{text-align:left}
.chk{width:24px;height:24px;border-radius:7px;border:1.8px solid var(--line2);display:grid;place-items:center;font-weight:800;flex:none}
.fitrow[aria-pressed="true"] .chk{background:var(--btn);border-color:var(--btn);color:var(--btn-ink)}
.overcard{border:1.5px solid var(--warnbar);background:#FFF6F4}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .overcard{background:#2A1C1A} }
.li.col{flex-direction:column;align-items:stretch;gap:6px}
.optl{width:24px;height:24px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.faded{opacity:.6}
</style>
</head>
<body>
<header class="top" id="top" hidden><div class="brand" id="brand">Era</div></header>
<main class="wrap" id="view"></main>
<nav class="tabs" id="tabs" aria-label="Sections" hidden><div class="in">
  <button data-tab="today"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3 2"/></svg>Today</button>
  <button data-tab="week"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Week</button>
  <button data-tab="choose"><svg viewBox="0 0 24 24"><path d="M12 4v16M5 8h14M5 8l-2.5 6a3 3 0 0 0 5 0zM19 8l-2.5 6a3 3 0 0 0 5 0zM8 20h8"/></svg>Choose</button>
  <button data-tab="era"><svg viewBox="0 0 24 24"><path d="M12 3l8.6 6.2-3.3 10.1H6.7L3.4 9.2z"/></svg>Era</button>
  <button data-tab="me"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Me</button>
</div></nav>
<div id="sheets"></div>
<script src="version.js"></script>
<script src="js/model.js"></script>
<script src="js/draw.js"></script>
<script src="js/screens.js"></script>
<script src="js/choose.js"></script>
<script src="js/app.js"></script>
</body>
