name: Test and build APK

# Every push and pull request runs the end-to-end tests of every journey in a real browser.
# Pushes to main then build the Android app from the same web files and publish it as the "latest" release.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install the test browser
        run: |
          npm install --no-save --no-package-lock playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Run every journey end to end
        run: |
          python3 -m http.server 8777 >/dev/null 2>&1 &
          sleep 1
          ERA_SHOTS=test-failures node tests/e2e.js
      - name: Keep screenshots of failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-failures
          path: test-failures
          if-no-files-found: ignore

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Copy the web app into the APK
        run: |
          mkdir -p android/app/src/main/assets/icons android/app/src/main/assets/js
          cp index.html version.js manifest.webmanifest android/app/src/main/assets/
          cp js/*.js android/app/src/main/assets/js/
          cp icons/*.png android/app/src/main/assets/icons/

      - name: Write the signing key from secrets
        env:
          ERA_KEYSTORE_BASE64: ${{ secrets.ERA_KEYSTORE_BASE64 }}
        run: echo "$ERA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/era.jks"

      - name: Build
        working-directory: android
        env:
          ERA_KEYSTORE: ${{ runner.temp }}/era.jks
          ERA_KEYSTORE_PASSWORD: ${{ secrets.ERA_KEYSTORE_PASSWORD }}
          ERA_KEY_PASSWORD: ${{ secrets.ERA_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      # Stops an unsigned APK from being published, and logs the certificate for checking.
      - name: Check the APK is signed
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs android/app/build/outputs/apk/release/app-release.apk

      - name: Publish latest APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Era.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Era.apk --title "Era (latest)" \
            --notes "Download Era.apk on your Android phone and tap it to install. Built from ${GITHUB_SHA::7}."
