name: Build APK

# Every push builds the Android app from the same web files and publishes it as the "latest" release.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Copy the web app into the APK
        run: |
          mkdir -p android/app/src/main/assets/icons
          cp index.html app.js manifest.webmanifest android/app/src/main/assets/
          cp icons/*.png android/app/src/main/assets/icons/

      - name: Build
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Publish latest APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Era.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Era.apk --title "Era (latest)" \
            --notes "Download Era.apk on your Android phone and tap it to install. Built from ${GITHUB_SHA::7}."
